<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E'lon — Topdik-KU</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <script src="js/theme.js"></script>
  <style>
    .item-detail { display: grid; grid-template-columns: 1.2fr 1fr; gap: 2rem; }
    .item-gallery { border-radius: var(--radius-lg); overflow: hidden; background: var(--bg-secondary); aspect-ratio: 4/3; }
    .item-gallery img { width: 100%; height: 100%; object-fit: cover; }
    .item-meta { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1rem 0; font-size: 0.9375rem; color: var(--text-secondary); }
    .item-meta span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .item-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem; }
    .publisher { display: flex; align-items: center; gap: 0.75rem; padding: 1rem; border-radius: var(--radius-md); margin-top: 1.5rem; }
    .publisher-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--accent); }
    .similar-grid { margin-top: 3rem; }
    @media (max-width: 768px) {
      .item-detail { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app-header"></div>
  
  <main class="main">
    <div class="container" id="itemContent">
      <div style="text-align:center;padding:4rem">
        <div class="spinner" style="margin:0 auto"></div>
      </div>
    </div>
  </main>
  
  <div id="app-footer"></div>
  
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.initCommon('');
      
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      const item = DataStore.getItem(id);
      
      if (!item) {
        document.getElementById('itemContent').innerHTML = `
          <div class="empty-state">
            <h3>E'lon topilmadi</h3>
            <a href="index.html" class="btn btn-primary" style="margin-top:1rem">Bosh sahifa</a>
          </div>
        `;
        return;
      }
      
      document.title = `${item.title} — Topdik-KU`;
      
      const session = DataStore.getSession();
      const saved = session ? DataStore.isCollected(session.id, item.id) : false;
      const img = item.images?.[0] || UI.placeholderImg(item.category);
      const matches = DataStore.getMatchesFor(item.id);
      
      document.getElementById('itemContent').innerHTML = `
        <div class="item-detail">
          <div>
            <div class="item-gallery glass-card">
              <img src="${img}" alt="${UI.escape(item.title)}" onerror="this.src='${UI.placeholderImg(item.category)}'">
            </div>
          </div>
          
          <div>
            <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;flex-wrap:wrap">
              ${UI.statusBadge(item.status)}
              <span class="badge">${item.type === 'found' ? t('filter_found') : t('filter_lost')}</span>
              <span class="badge">${UI.categoryName(item.category)}</span>
            </div>
            
            <h1 style="font-size:1.75rem;margin-bottom:0.5rem">${UI.escape(item.title)}</h1>
            
            <div class="item-meta">
              <span>📍 ${UI.escape(item.location)}</span>
              <span>📅 ${UI.formatDateTime(item.date, item.time)}</span>
              <span>🕒 ${UI.timeAgo(item.createdAt)}</span>
            </div>
            
            <p style="color:var(--text-secondary);line-height:1.7;margin:1.25rem 0">${UI.escape(item.description)}</p>
            
            <div class="glass-card" style="padding:1.25rem;margin:1.25rem 0;border:1px solid var(--accent);background:var(--accent-soft)">
              <div style="font-weight:600;margin-bottom:0.5rem">Xabarlashish</div>
              ${session && session.id === item.userId ? `
                <p style="font-size:0.875rem;color:var(--text-secondary);margin:0">
                  Bu <strong>sizning</strong> e'loningiz. Boshqa foydalanuvchi e'lonni ochib
                  <strong>Bog'lanish</strong> bosganda xabar <a href="messages.html" style="color:var(--accent)">Xabarlar</a> bo'limida chiqadi.
                </p>
              ` : session ? `
                <p style="font-size:0.875rem;color:var(--text-secondary);margin-bottom:0.75rem">
                  E'lon egasiga ichki chat orqali yozing. Telefon raqami ochiq ko'rinmaydi.
                </p>
                <a href="messages.html?to=${item.userId}&item=${item.id}" class="btn btn-primary" style="width:100%">
                  ${t('btn_contact')} — xabar yozish
                </a>
              ` : `
                <p style="font-size:0.875rem;color:var(--text-secondary);margin-bottom:0.75rem">
                  Xabar yozish uchun avval tizimga kiring.
                </p>
                <a href="auth.html?mode=login&redirect=${encodeURIComponent('messages.html?to=' + item.userId + '&item=' + item.id)}" class="btn btn-primary" style="width:100%">
                  Kirish va bog'lanish
                </a>
              `}
            </div>

            <div class="item-actions">
              ${session ? `
                <button class="btn btn-secondary btn-save" data-id="${item.id}">
                  <svg width="18" height="18" fill="${saved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="vertical-align:-3px"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                  ${saved ? t('btn_saved') : t('btn_save')}
                </button>
              ` : ''}
              <button class="btn btn-ghost" id="reportBtn">Report</button>
            </div>
            
            <div class="glass publisher">
              <div class="publisher-avatar">${(item.userName || 'U')[0].toUpperCase()}</div>
              <div>
                <div style="font-weight:600">${UI.escape(item.userName || 'Foydalanuvchi')}</div>
                <div style="font-size:0.8125rem;color:var(--text-muted)">E'lon muallifi</div>
              </div>
            </div>
          </div>
        </div>
        
        ${matches.length ? `
          <div class="similar-grid">
            <h2 class="section__title" style="margin-bottom:1.25rem">O'xshash e'lonlar / Smart Match</h2>
            <div class="grid grid-3">
              ${matches.map(m => UI.itemCard(m)).join('')}
            </div>
          </div>
        ` : ''}
      `;
      
      document.getElementById('reportBtn')?.addEventListener('click', () => {
        UI.toast('Hisobot yuborildi. Moderatorlar tekshiradi.', 'info');
      });
      
      updatePageTranslations();
    });
  </script>
</body>
</html>
